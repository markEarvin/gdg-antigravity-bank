[project]
name = "gdg-antigravity-bank"
version = "0.1.0"
description = "Starter repository for the GDG Antigravity multi-agent P2P banking demo."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
